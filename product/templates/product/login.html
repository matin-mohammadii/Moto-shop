<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ورود</title>
</head>
<body>
{% extends 'product/base.html' %}

{% block title %}ورود به حساب{% endblock %}

{% block content %}

<div class="card" style="max-width:500px; margin:40px auto;">

    <h1>ورود به حساب کاربری</h1>

    <p>برای ادامه خرید وارد حساب خود شوید.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">ورود</button>
    </form>

    <p>
        حساب کاربری ندارید؟
        <a href="{% url 'register' %}">ثبت‌نام کنید</a>
    </p>

</div>

{% endblock %}
   

</body>
</html>
