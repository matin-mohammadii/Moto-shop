<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}فروشگاه لوازم موتورسیکلت{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: #181818;
            color: #eeeeee;
        }

        header {
            background: #242424;
            padding: 20px 7%;
            border-bottom: 2px solid #ff7500;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            color: #ff7500;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
        }

        nav a {
            color: #eeeeee;
            text-decoration: none;
            margin: 5px 8px;
        }

        nav a:hover {
            color: #ff7500;
        }

        .container {
            width: 86%;
            max-width: 1200px;
            margin: 35px auto;
            min-height: 60vh;
        }

        h1, h2, h3 {
            color: #ff8500;
        }

        button, .btn {
            background: #ff7500;
            color: #fff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        button:hover, .btn:hover {
            background: #d96100;
        }

        input, select, textarea {
            background: #292929;
            color: white;
            border: 1px solid #555;
            padding: 10px;
            border-radius: 5px;
            margin: 6px 0;
            max-width: 100%;
        }

        .card {
            background: #252525;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #383838;
            margin-bottom: 18px;
        }

        .message {
            padding: 12px;
            margin-bottom: 12px;
            background: #333;
            border-right: 4px solid #ff7500;
            border-radius: 5px;
        }

        footer {
            background: #242424;
            text-align: center;
            padding: 25px;
            color: #aaa;
            margin-top: 50px;
        }

        @media (max-width: 650px) {
            header {
                padding: 18px;
            }

            nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .container {
                width: 92%;
            }
        }
        .product-image {
    width: 100%;
    height: 220px;
    object-fit: contain;
    background: #fff;
    border-radius: 8px;
    margin-bottom: 12px;
}

.detail-image {
    width: 100%;
    max-width: 500px;
    height: 350px;
    object-fit: contain;
    background: #fff;
    border-radius: 10px;
}

.no-image {
    background: #292929;
    padding: 35px;
    text-align: center;
    color: #aaa;
    border-radius: 8px;
}
    </style>
</head>

<body>

<header>
    <nav>
        <a class="logo" href="{% url 'product_list' %}">
            MOTO SHOP
        </a>

        <div>
            <a href="{% url 'product_list' %}">فروشگاه</a>
            {% if user.is_authenticated %}
                <a href="{% url 'cart' %}">سبد خرید</a>
                <a href="{% url 'order_history' %}">سفارش‌های من</a>
                <a href="{% url 'profile' %}">پروفایل</a>

                <form method="POST" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">خروج</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">ورود</a>
                <a href="{% url 'register' %}">ثبت‌نام</a>
            {% endif %}
        </div>
    </nav>
</header>

<main class="container">

    {% if messages %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

<footer>
    فروشگاه اینترنتی لوازم موتورسیکلت
</footer>

</body>
</html>
